name: CI Pipeline

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install flask pytest requests pytest-json-report

      - name: Run tests
        id: run_tests
        run: |
          pytest tests/ -v --tb=short --json-report --json-report-file=pytest_report.json
        continue-on-error: true

      - name: Build JSON report
        run: |
          python - <<'PYEOF'
          import json, os

          with open("pytest_report.json") as f:
              pr = json.load(f)

          tests = []
          for t in pr.get("tests", []):
              tests.append({
                  "name": t["nodeid"],
                  "result": t["outcome"],
                  "failure_message": t.get("call", {}).get("longrepr", "") if t["outcome"] == "failed" else ""
              })

          total  = len(tests)
          passed = sum(1 for t in tests if t["result"] == "passed")
          failed = total - passed

          report = {
              "repository":     os.environ.get("GITHUB_REPOSITORY", ""),
              "branch":         os.environ.get("GITHUB_REF_NAME", ""),
              "commit_sha":     os.environ.get("GITHUB_SHA", ""),
              "run_id":         os.environ.get("GITHUB_RUN_ID", ""),
              "timestamp":      os.environ.get("GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP", ""),
              "tests":          tests,
              "total_count":    total,
              "passed_count":   passed,
              "failed_count":   failed,
              "overall_status": "passed" if failed == 0 else "failed"
          }

          with open("report_to_send.json", "w") as f:
              json.dump(report, f, indent=2)

          print(f"Status: {'PASSED' if failed == 0 else 'FAILED'}")
          print(f"Total: {total}, Passed: {passed}, Failed: {failed}")
          PYEOF

      - name: Send report to receiver
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d @report_to_send.json \
            "${{ secrets.RECEIVER_URL }}/report" || echo "Receiver not reachable"

      - name: Fail if tests failed
        run: |
          python -c "
          import json
          with open('report_to_send.json') as f:
              r = json.load(f)
          if r['overall_status'] == 'failed':
              print('TESTS FAILED')
              exit(1)
          print('ALL TESTS PASSED')
          "

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static
          publish_branch: gh-pages

  email_report:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install flask pytest requests pytest-json-report

      - name: Run tests for report
        run: |
          pytest tests/ -v --tb=short --json-report --json-report-file=pytest_report.json
        continue-on-error: true

      - name: Build report for email
        run: |
          python - <<'PYEOF'
          import json, os

          with open("pytest_report.json") as f:
              pr = json.load(f)

          tests = []
          for t in pr.get("tests", []):
              tests.append({
                  "name": t["nodeid"],
                  "result": t["outcome"],
                  "failure_message": t.get("call", {}).get("longrepr", "") if t["outcome"] == "failed" else ""
              })

          total  = len(tests)
          passed = sum(1 for t in tests if t["result"] == "passed")
          failed = total - passed

          report = {
              "repository":     os.environ.get("GITHUB_REPOSITORY", ""),
              "branch":         os.environ.get("GITHUB_REF_NAME", ""),
              "commit_sha":     os.environ.get("GITHUB_SHA", ""),
              "run_id":         os.environ.get("GITHUB_RUN_ID", ""),
              "timestamp":      os.environ.get("GITHUB_EVENT_HEAD_COMMIT_TIMESTAMP", ""),
              "tests":          tests,
              "total_count":    total,
              "passed_count":   passed,
              "failed_count":   failed,
              "overall_status": "passed" if failed == 0 else "failed"
          }

          with open("report_to_send.json", "w") as f:
              json.dump(report, f, indent=2)
          PYEOF

      - name: Send email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI Report - ${{ github.repository }} - ${{ github.sha }}"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}
          convert_markdown: true
          body: |
            CI Pipeline Report
            ==================
            Repository : ${{ github.repository }}
            Branch     : ${{ github.ref_name }}
            Commit SHA : ${{ github.sha }}
            Run ID     : ${{ github.run_id }}

            Check attached JSON for full test results.
          attachments: report_to_send.json
